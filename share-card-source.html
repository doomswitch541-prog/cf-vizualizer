<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Coldflame archive share card</title>
  <link rel="stylesheet" href="share-card.css">
</head>
<body>
  <main class="card" aria-label="Coldflame complete release archive">
    <div class="signal-lines" aria-hidden="true"></div>
    <section class="card-copy">
      <p class="kicker">Northern California · 2021—2025</p>
      <h1>Coldflame</h1>
      <p class="subtitle">Complete release archive</p>
      <div class="rule" aria-hidden="true"></div>
      <div class="facts">
        <span><strong>07</strong> tracks</span>
        <span><strong>05</strong> releases</span>
        <span><strong>25:25</strong> runtime</span>
      </div>
      <p class="descriptor">Artwork-reactive listening room</p>
    </section>

    <section class="cover-constellation" aria-label="Five Coldflame release covers">
      <svg class="orbit" viewBox="0 0 560 560" aria-hidden="true">
        <ellipse cx="280" cy="280" rx="231" ry="217"></ellipse>
        <path d="M280 49 499 213 416 456 144 456 61 213Z"></path>
        <circle cx="280" cy="49" r="5"></circle>
        <circle cx="461" cy="144" r="5"></circle>
        <circle cx="499" cy="348" r="5"></circle>
        <circle cx="382" cy="483" r="5"></circle>
        <circle cx="178" cy="483" r="5"></circle>
        <circle cx="61" cy="348" r="5"></circle>
        <circle cx="99" cy="144" r="5"></circle>
      </svg>
      <figure class="cover cover-one"><img src="assets/coldflame/artwork/2021-lose-myself.jpg" alt=""></figure>
      <figure class="cover cover-two"><img src="assets/coldflame/artwork/2022-youre-gone.jpg" alt=""></figure>
      <figure class="cover cover-main"><img src="assets/coldflame/artwork/2023-3.jpg" alt=""></figure>
      <figure class="cover cover-four"><img src="assets/coldflame/artwork/2024-break-me-down.jpg" alt=""></figure>
      <figure class="cover cover-five"><img src="assets/coldflame/artwork/2025-die-for-me.jpg" alt=""></figure>
    </section>

    <div class="archive-stamp" aria-hidden="true"><span>CF</span></div>
    <p class="edition">Archive no. 001</p>
  </main>
</body>
</html>
